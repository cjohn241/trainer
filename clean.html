<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedroom Reset · The Brawnforge</title>
  <!--
    clean.html - Mara's bedroom reset for the TV. Four timed rounds and a bonus, with her
    big dialogue portrait (64 x 64) so you can see her face from across the room.

    tools/clean-video/build_clean.py screenshots this page into voice/clean.mp4, with her
    voice and the bells. The TV plays that video (cast_mara.py clean), so the sound always works.
    You can also open this page on its own. Then it runs live and plays sound if the browser lets it.

    In the address:
      at=95       freezes at 95 seconds in (the video builder uses this)
      speed=20    runs 20 times faster, for trying it out
      sound=0     no sound in live mode
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&display=swap">
  <style>
    :root {
      --bg: #15121d;
      --card: #1e1a29;
      --ink: #ede6d3;
      --muted: #aaa2bb;
      --line: #3a3350;
      --gold: #e6c36e;
      --ember: #e8823a;
      --blood: #c0473c;
      --display: "Cinzel", Georgia, serif;
      --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
    body {
      background:
        radial-gradient(ellipse at 24% 52%, rgba(232, 130, 58, .18), transparent 52%),
        var(--bg);
    }

    /* Everything moves together when Mara yells */
    #screen { position: absolute; inset: 0; padding: 5vh 4.5vw; display: grid; grid-template-columns: auto 1fr; gap: 3.5vw; align-items: center; }

    /* Her portrait in an RPG dialogue frame */
    .portrait { display: flex; flex-direction: column; align-items: center; }
    .frame {
      padding: 1vh;
      border: .45vh solid var(--line);
      border-radius: 1.4vh;
      background: radial-gradient(circle at 50% 40%, #2c2440, #17131f 70%);
      box-shadow: 0 0 0 .45vh #0d0b12, 0 2vh 5vh rgba(0, 0, 0, .5);
    }
    #mara { display: block; width: 76vh; height: 76vh; image-rendering: pixelated; }
    .nameplate {
      margin-top: -2.4vh; padding: .7vh 2.4vh; position: relative;
      background: var(--card); border: .35vh solid var(--gold); border-radius: .8vh;
      font-family: var(--display); font-weight: 700; font-size: 2.6vh; letter-spacing: .14em; color: var(--gold);
    }

    .side { display: flex; flex-direction: column; height: 100%; justify-content: center; min-width: 0; }
    .top { display: flex; justify-content: space-between; align-items: center; font-size: 2.5vh; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .pips { display: flex; gap: 1vh; }
    .pip { width: 2.4vh; height: 2.4vh; border-radius: 50%; border: .3vh solid var(--line); }
    .pip.done { background: var(--gold); border-color: var(--gold); }
    .pip.now { border-color: var(--ember); box-shadow: 0 0 1.2vh var(--ember); }
    .pip.bonus { border-radius: .4vh; transform: rotate(45deg) scale(.85); }

    .label { margin-top: 3vh; font-size: 3vh; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: .4vh 0 0; font-family: var(--display); font-weight: 700; font-size: 8vh; line-height: 1.02; color: var(--gold); }
    h1.alarm { color: var(--blood); }
    .task { margin: 1.6vh 0 0; font-size: 3.4vh; line-height: 1.3; }
    .timer { margin-top: 1vh; font-family: var(--display); font-weight: 700; font-size: 19vh; line-height: 1; color: var(--ember); font-variant-numeric: tabular-nums; }
    .timer.low { color: var(--blood); }
    .timer.hide { visibility: hidden; }

    .bubble {
      position: relative; margin-top: 2.4vh; padding: 2vh 2.4vh; min-height: 11vh;
      background: var(--card); border: .35vh solid var(--line); border-radius: 1.6vh;
      font-size: 3.3vh; font-style: italic; line-height: 1.3;
    }
    .bubble::before {
      content: ""; position: absolute; left: -2.2vh; top: 3vh; border: 1.1vh solid transparent;
      border-right: 1.1vh solid var(--line); border-top-width: 1.2vh; border-bottom-width: 1.2vh;
    }
    .bubble.empty { visibility: hidden; }
    .bubble b { font-style: normal; color: var(--blood); }
    .foot { margin-top: 2vh; display: flex; justify-content: space-between; font-size: 2.6vh; color: var(--muted); }
    .foot b { color: var(--gold); }

    /* The red flash when she yells */
    #flash { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 22vh 6vh rgba(192, 71, 60, .55); opacity: 0; }

    /* XP pop after each round */
    #pop { position: absolute; right: 6vw; top: 16vh; font-family: var(--display); font-weight: 700; font-size: 9vh; color: var(--gold); text-shadow: 0 .6vh 0 #000, 0 0 3vh rgba(230, 195, 110, .6); opacity: 0; }

    .sound-note { position: absolute; left: 50%; top: 1.5vh; transform: translateX(-50%); font-size: 2vh; color: var(--muted); }
  </style>
</head>

      <div class="timer" id="timer"></div>
      <div class="bubble" id="bubble"></div>
      <div class="foot"><span id="next"></span><span>XP <b id="xp">0</b> / 60</span></div>
    </div>
  </div>
  <div id="flash"></div>
  <div id="pop"></div>
