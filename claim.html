<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claim it · The Brawnforge</title>
  <!--
    claim.html - Mara's "scan to claim" card for the TV. tv-cue/cast_mara.py casts it after a
    Down Dog class or a strength video ends. (The battle walk shows its own code on its victory
    screen.) Scanning the code with the phone opens The Brawnforge with the workout filled in.
    Display only: no buttons, no saved data.

    In the address:
      kind=yoga&min=17&d=2026-11-19&id=y1795...             a Down Dog class
      kind=strength&t=strength-b&d=2026-11-19&id=s...        a strength video
      still=1                                                no code (the picture for Mara's voice clip)
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@600;700&display=swap">
  <style>
    /* Same colors and fonts as cue.html */
    :root {
      --bg: #15121d; --ink: #ede6d3; --muted: #aaa2bb; --line: #3a3350; --gold: #e6c36e; --ember: #e8823a;
      --display: "Cinzel", Georgia, serif;
      --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 20% 60%, rgba(232, 130, 58, .14), transparent 55%), var(--bg);
      color: var(--ink); font-family: var(--body);
    }
    /* TVs crop the edges a little, so everything stays inside a safe margin */
    .claim { height: 100%; padding: 7vh 6vw; display: grid; grid-template-columns: 24% 1fr auto; align-items: center; gap: 3.5vw; }
    #mara { width: 100%; aspect-ratio: 1; image-rendering: pixelated; }
    .brand { margin: 0 0 1.2vh; font-family: var(--display); font-size: 1.9vw; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 6vw; line-height: 1; color: var(--gold); }
    .line { margin: 3.5vh 0 0; font-size: 2.7vw; line-height: 1.3; }
    .facts { margin: 2.5vh 0 0; font-size: 2vw; color: var(--muted); line-height: 1.35; }
    .code { width: 46vh; height: 46vh; background: #fff; border-radius: 1vw; padding: 1.4vh; display: grid; place-items: center; }
    #qr { width: 100%; height: 100%; image-rendering: pixelated; }
    .code.waiting { background: none; border: .4vh dashed var(--line); color: var(--muted); font-size: 2vw; text-align: center; }
    .under { margin: 1.4vh 0 0; text-align: center; font-size: 1.5vw; color: var(--muted); }
  </style>
</head>
<body>
  <main class="claim">
    <canvas id="mara" width="32" height="32" role="img" aria-label="Mara the Unbent"></canvas>
    <div>
      <p class="brand">The Brawnforge</p>
      <h1 id="title">Done</h1>
      <p class="line">Scan the code with your phone to claim it.</p>
      <p class="facts" id="facts"></p>
    </div>
    <div>
      <div class="code" id="code"><canvas id="qr" role="img" aria-label="QR code to claim this workout"></canvas></div>
      <p class="under">Point your phone's camera at it</p>
    </div>
  </main>

  <script src="js/data/sprites.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/data/templates.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const kind = params.get('kind') || '';
      const template = kind === 'strength' ? TEMPLATES[params.get('t')] : null;

      // Mara's pose and the words for each kind of workout
      let sprite = 'power-pose';
      if (kind === 'yoga') {
        sprite = 'yoga-dog';
        document.getElementById('title').textContent = 'Yoga done';
        document.getElementById('facts').textContent = `${params.get('min') || '?'} minutes of Down Dog. You bent. Fine.`;
      } else if (template) {
        sprite = params.get('t') === 'strength-b' ? 'db-rdl' : 'goblet-squat';
        document.getElementById('title').textContent = template.name + ' done';
        document.getElementById('facts').textContent = 'Log your sets on your phone so your weights keep climbing.';
      }
      playSprite(document.getElementById('mara'), SPRITES[sprite]);

      // The picture for Mara's voice clip has no code yet
      if (params.get('still') === '1' || !params.get('id')) {
        const box = document.getElementById('code');
        box.classList.add('waiting');
        box.textContent = 'Your code is next';
        return;
      }

      // The code: The Brawnforge's address with the workout in it (claim.js reads it)
      const claim = new URLSearchParams({ d: params.get('d') || '', id: params.get('id') });
      if (kind === 'yoga') claim.set('min', params.get('min') || '0');
      if (template) claim.set('t', params.get('t'));
      const link = new URL('./', location.href).href + `#claim/${kind}?${claim}`;
      drawQr(document.getElementById('qr'), link);
      window.CLAIM_LINK = link; // for checking

      /** Draws a QR code on a canvas, one pixel per square, with the white border scanners need. */
      function drawQr(canvas, text) {
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const n = qr.getModuleCount(), border = 4, size = n + border * 2;
        canvas.width = canvas.height = size;
        const g = canvas.getContext('2d');
        g.fillStyle = '#fff';
        g.fillRect(0, 0, size, size);
        g.fillStyle = '#000';
        for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) g.fillRect(x + border, y + border, 1, 1);
      }
    })();
  </script>
</body>
</html>
